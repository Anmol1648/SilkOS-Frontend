# FundOS frontend Nginx — gyain / fefundos.gyain.com (10.130.0.20)
# Serves the SPA as https://fundos.gyain.com and reverse-proxies /api/* to the
# backend (befundos, 10.130.0.34) over the private network. TLS via the
# pre-issued wildcard *.gyain.com certificate.
#
# NOTE: FundOS resolves the tenant from the JWT, not the hostname, so a single
# server_name serves every tenant. (No per-tenant subdomain routing is needed.)

server {
    listen 10.130.0.20:80;
    server_name fundos.gyain.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 10.130.0.20:443 ssl http2;
    server_name fundos.gyain.com;

    ssl_certificate     /etc/pki/gyain/fullchain.pem;
    ssl_certificate_key /etc/pki/gyain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /d01/fundos-web/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable — cache hard
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # The SPA shell must never be cached stale
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Same-origin API: proxy to the backend over its private IP.
    location /api/ {
        proxy_pass https://befundos_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        befundos.gyain.com;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 60m;   # material uploads pass through here
        proxy_read_timeout   180s;  # exports and long polls
    }

    # SPA fallback — deep links like /deals/<id>/stage/2 load the shell
    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# Backend upstream reached over the private network
upstream befundos_upstream {
    server 10.130.0.34:443;
}
